[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multibot2"
version = "0.1.0"
description = "Mavis Trading Bot"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<3",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.setuptools]
py-modules = [
    "main",
    "config",
    "market_data",
    "candles",
    "strategies",
    "trading",
    "telegram",
    "backtest",
    "dashboard",
    "zerodha_provider",
]
