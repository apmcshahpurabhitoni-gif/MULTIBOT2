services:
  - type: web
    name: multibot2
    runtime: python
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: pip install -e .
    startCommand: python main.py
    healthCheckPath: /ping
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: PORT
        value: 10000
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: WEBHOOK_URL
        sync: false

# Keep the Render web service warm with the existing external cron job.
# Configure cron-job.org (or the service you already use) to GET:
#   https://<your-render-service>.onrender.com/ping
# every 10 minutes. The endpoint is intentionally lightweight and does not
# start a scan or mutate trading state.
